# nfpm configuration for the .deb and .rpm packages. Driven by build-packages.sh, which sets the
# HANDY* environment variables, stages the build in artifacts/stage/ and runs nfpm from the repository root.
# nfpm expands ${VAR} in scalar fields (version, prerelease) but NOT in contents src paths.
name: handy
arch: amd64
platform: linux
version: ${HANDY_VERSION}
prerelease: ${HANDY_PRERELEASE}
release: 1
section: utils
priority: optional
maintainer: David Kozma <k0zi@outlook.com>
vendor: k0zi
homepage: https://github.com/k0zi/Handy
license: MIT
description: |-
  Modular desktop toolbox
  Handy is a shell with a side menu, settings, themes and languages; everything else is a module.
  Modules are loaded from ~/.local/share/handy/Modules and picked up without a restart.

contents:
  # type: tree keeps the directory structure (a trailing-slash glob flattens subfolders and collides).
  - src: artifacts/stage/app
    dst: /usr/lib/handy
    type: tree
  - src: /usr/lib/handy/Handy
    dst: /usr/bin/handy
    type: symlink
  # ── menu entry + icon ──
  - src: artifacts/stage/handy.desktop
    dst: /usr/share/applications/handy.desktop
  - src: artifacts/stage/handy-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/handy.png
  # ── licence: Debian policy location vs. RPM %license (staged by build-packages.sh, see THIRD_PARTY_NOTICES.md) ──
  - src: artifacts/stage/doc/LICENSE
    dst: /usr/share/doc/handy/copyright
    packager: deb
  - src: artifacts/stage/doc/LICENSE
    dst: /usr/share/licenses/handy/LICENSE
    packager: rpm
    type: license
  # Third-party notices and license texts for the redistributed components.
  - src: artifacts/stage/doc/THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/handy/THIRD_PARTY_NOTICES.md
    packager: deb
  - src: artifacts/stage/doc/licenses
    dst: /usr/share/doc/handy/licenses
    type: tree
    packager: deb
  - src: artifacts/stage/doc/THIRD_PARTY_NOTICES.md
    dst: /usr/share/licenses/handy/THIRD_PARTY_NOTICES.md
    packager: rpm
    type: license
  - src: artifacts/stage/doc/licenses
    dst: /usr/share/licenses/handy/licenses
    type: tree
    packager: rpm

# Self-contained .NET build: only native libraries of the base system are needed.
# Avalonia on X11 needs the X libraries and fontconfig (Skia); GL, GTK and Vulkan are optional.
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu67
      - libx11-6
      - libice6
      - libsm6
      - libxcursor1
      - libxext6
      - libxfixes3
      - libxi6
      - libxrandr2
      - libfontconfig1
    recommends:
      - libgl1
      - libegl1
      - libgtk-3-0t64 | libgtk-3-0
      - libvulkan1
  rpm:
    # Shared-library capabilities have the same names on Fedora/RHEL and openSUSE, unlike the package names.
    depends:
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.65()(64bit))
      - libX11.so.6()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXext.so.6()(64bit)
      - libXfixes.so.3()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libfontconfig.so.1()(64bit)
    recommends:
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
      - libvulkan.so.1()(64bit)
